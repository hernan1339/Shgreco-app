HTML

Para empaquetarlo y entregarte el APK listo para instalar en tu teléfono celular, utilizaremos una automatización mediante un repositorio de GitHub y GitHub Actions.

Sigue estos sencillos pasos:

Paso 1: Crea un repositorio en GitHub
Ve a GitHub e inicia sesión (o crea una cuenta gratuita si no la tienes).

Toca en el botón + (arriba a la derecha) y selecciona New repository.

Ponle un nombre, por ejemplo: shgreco-app.

Elige Public y haz clic en Create repository.

Paso 2: Sube los archivos de la app
Dentro de tu nuevo repositorio en GitHub, vas a subir 2 archivos:

Tu código Web:

Haz clic en Add file -> Upload files.

Sube tu archivo appinstructor.html y renómbralo a index.html (o cambia el nombre antes de subirlo).   
HTML

Presiona el botón verde Commit changes.

El script de compilación automática:

Haz clic en Add file -> Create new file.

En la casilla del nombre del archivo escribe exactamente la siguiente ruta:
.github/workflows/build-apk.yml

En el editor de texto pega el siguiente código completo:

YAML
name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor CLI & Create Project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init Shgreco com.shgreco.app --web-dir .
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shgreco-App-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
